# ==========================================================================

# Your name exactly as it is written in the author lists. It is shown in bold.
me: "Shid-Moosavi, S."

# --------------------------------------------------------------------------
#  TYPES = the coloured tag on each card and the filter buttons at the top.
#  - key    : short id; each paper's "type:" must match one of these keys
#  - tag    : text of the coloured tag on the card
#  - filter : text of the filter button
#  - color  : teal, purple, amber, green, red, blue or gray
#  Filter buttons appear in this order, and only for types that have at
#  least one paper. To add a new type, copy one block (see the examples
#  at the bottom of this list) and use its key on a paper.
# --------------------------------------------------------------------------
types:
  - key: journal
    tag: "Journal Paper"
    filter: "Journal Papers"
    color: teal

  - key: conference
    tag: "Conference Paper"
    filter: "Conference Papers"
    color: purple

  - key: thesis
    tag: "Thesis"
    filter: "Theses"
    color: amber

  # More examples. Remove the # in front of the lines to use them.
  # - key: preprint
  #   tag: "Preprint"
  #   filter: "Preprints"
  #   color: gray
  #
  # - key: chapter
  #   tag: "Book Chapter"
  #   filter: "Book Chapters"
  #   color: green
  #
  # - key: review
  #   tag: "Under Review"
  #   filter: "Under Review"
  #   color: red

# --------------------------------------------------------------------------
#  PAPERS - newest at the top. They appear on the page in this order.
#
#  Copy this template, paste it at the top of the list, and fill it in:
#
#  - title: "Paper Title"
#    authors: "Shid-Moosavi, S., Co-Author, A., and Co-Author, B."
#    venue: "Journal or Conference Name"
#    year: 2027
#    type: journal               # a key from the TYPES list above
#    description: "One or two short sentences about the paper."
#    doi: "https://doi.org/10.xxxx/xxxxx"   # optional
#    paper: ""                   # optional: other link (arXiv, ResearchGate, PDF)
#    manuscript: ""              # optional: link to the manuscript PDF
#    slides: ""                  # optional: link to the slides PDF
#
#  Optional links: leave them empty ("") or delete the line, and their
#  button is not shown. The paper title links to the DOI, or to "paper"
#  or "manuscript" if there is no DOI. To link a file you uploaded to the
#  files/ folder, use for example: "/files/slides/my-talk.pdf"
#  Avoid double quotes (") inside the text; use single quotes (') instead.
# --------------------------------------------------------------------------
